name: Publish Docker image

on:
  push:
    branches: [master, develop]
    tags: ["*"]

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ github.repository }}:${{ github.ref_name }}
            ${{ github.ref == 'refs/heads/master' && format('{0}:latest', github.repository) || '' }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Deploy to GKE (master/develop)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
        env:
          PROJECT_ID: astute-nuance-286909
          REGION: us-central1
          CLUSTER: homelab
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          umask 077
          printf '%s' "$GCP_SA_KEY" > /tmp/gcloud-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcloud-key.json
          gcloud container clusters get-credentials "$CLUSTER" --region "$REGION" --project "$PROJECT_ID"
          kubectl -n default set image deployment/acgn-bot acgn-bot=${{ github.repository }}@${{ steps.docker_build.outputs.digest }}
          kubectl -n default rollout status deployment/acgn-bot --timeout=300s

      - name: Remove cloud credentials
        if: always()
        run: rm -f /tmp/gcloud-key.json
