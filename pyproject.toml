[project]
name = "acgn-bot"
version = "0.1.0"
description = "Telegram bot for checking media updates"
requires-python = ">=3.11,<3.14"
dependencies = [
    "backoff==2.2.1",
    "beautifulsoup4==4.13.4",
    "chinese_converter==1.1.1",
    "python-dotenv==1.2.2",
    "python-telegram-bot==22.1",
    "pyyaml==6.0.2",
    "requests==2.33.0",
    "schedule==1.2.2",
]

[dependency-groups]
dev = [
    "ipykernel",
    "isort",
    "pylint",
]

[tool.uv]
package = false
